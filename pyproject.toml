[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secreview"
version = "0.1.0"
description = "AI-powered security review with a generator/verifier detection pipeline and a public, labeled benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-security-codereviewer" }]
keywords = ["security", "code-review", "sast", "llm", "claude", "github-action"]

dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "unidiff>=0.7.5",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
secreview = "secreview.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secreview"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/secreview"]
