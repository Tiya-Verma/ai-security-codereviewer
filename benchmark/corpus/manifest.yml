# Labeled benchmark corpus index.
#
# Each entry is one labeled sample. `diff` is a path (relative to
# benchmark/corpus/) to a unified diff. The scoring "hit" definition is
# class-level: a finding counts as a true positive if it flags the sample's
# `cwe` anywhere in the diff. See benchmark/metrics.py.
#
# Target for v1: 100-300 samples, balanced across vuln classes, >=2-3 languages,
# mixing OWASP Benchmark, real CVE-fix pairs, synthetic injections, and
# deliberate false-positive traps. See CLAUDE.md "Benchmark Design".
#
# Current state (24 samples): Python + JavaScript + Go across 3 languages.
#   - 14 synthetic samples (incl. 4 false-positive traps), matched pairs.
#   - 10 real CVE-fix samples (5 matched positive/negative pairs) transcribed
#     byte-faithfully from actual fix commits; the positive is the vulnerable
#     pre-fix code, the negative is the fixed code (a labeled negative for that
#     same class). Every CVE sample carries `cve` + `source_url` for audit.
# OWASP Benchmark cases are still TODO.
#
# Deliberately NOT included: CVE-2024-35195 (requests, cert-validation on pooled
# connections). Its vulnerability is the *absence* of per-request TLS context in
# connection-pool reuse — the changed line looks benign in isolation and is not
# detectable from the diff alone, so it would be an unfair false-negative trap.
#
# Fields:
#   id             unique, stable slug
#   diff           path to the unified diff for this sample
#   is_vulnerable  true = labeled positive, false = labeled negative
#   cwe            ground-truth CWE id (omit if not class-specific)
#   severity       critical | high | medium | low | info
#   source         owasp | cve | synthetic | fp-trap
#   language       primary language of the sample
#   cve            CVE id (cve-sourced samples only)
#   source_url     fix-commit URL the sample was transcribed from (cve only)

